services:
  db:
    image: pgvector/pgvector:pg16
    container_name: liberlo_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-liberlo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-liberlo_dev}
      POSTGRES_DB: ${POSTGRES_DB:-liberlo_kb}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-liberlo}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
