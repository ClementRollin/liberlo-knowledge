services:
  db:
    image: pgvector/pgvector:pg16
    container_name: liberlo_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-liberlo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-liberlo_dev}
      POSTGRES_DB: ${POSTGRES_DB:-liberlo_kb}
    ports:
      - "5434:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-liberlo}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    container_name: liberlo_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-liberlo}:${POSTGRES_PASSWORD:-liberlo_dev}@db:5432/${POSTGRES_DB:-liberlo_kb}?schema=public
      JWT_SECRET: ${JWT_SECRET:-changeme_in_production_use_strong_random_secret}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      PORT: 3001
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: sh -c "npx prisma generate && npx prisma migrate deploy && npm run start:dev"

volumes:
  pg_data:
