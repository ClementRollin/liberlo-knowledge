name: CI — Production (main)

# Audit de sécurité requis avant tout merge dans main.

on:
  pull_request:
    branches: [main]

jobs:

  # ─── Security audit ────────────────────────────────────────────────────────
  security-audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Audit backend dependencies
        run: cd backend && npm ci --ignore-scripts && npm audit --audit-level=high

      - name: Audit frontend dependencies
        run: cd frontend && npm ci --ignore-scripts && npm audit --audit-level=high
