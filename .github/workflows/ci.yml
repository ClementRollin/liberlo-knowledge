name: CI

on:
  push:
    branches: [develop, re7, main]
  pull_request:
    branches: [develop, re7, main]

jobs:

  # ─── Enforce branch merge flow ─────────────────────────────────────────────
  # feature/* fix/* chore/* docs/* → develop
  # develop                        → re7
  # re7                            → main
  branch-flow:
    name: Branch flow
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check merge direction
        shell: bash
        run: |
          BASE="${{ github.base_ref }}"
          HEAD="${{ github.head_ref }}"
          echo "→ $HEAD into $BASE"

          case "$BASE" in
            develop)
              if [[ "$HEAD" == "develop" || "$HEAD" == "re7" || "$HEAD" == "main" ]]; then
                echo "❌ '$HEAD' ne peut pas merger dans develop."
                echo "   Seules les branches feature/ fix/ chore/ docs/ refactor/ test/ sont autorisées."
                exit 1
              fi
              ;;
            re7)
              if [[ "$HEAD" != "develop" ]]; then
                echo "❌ Seule 'develop' peut merger dans re7. Reçu : '$HEAD'."
                exit 1
              fi
              ;;
            main)
              if [[ "$HEAD" != "re7" ]]; then
                echo "❌ Seule 're7' peut merger dans main. Reçu : '$HEAD'."
                exit 1
              fi
              ;;
          esac
          echo "✅ Flow valide : $HEAD → $BASE"

  # ─── Backend — Lint ────────────────────────────────────────────────────────
  backend-lint:
    name: Backend — Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - run: cd backend && npm ci

      - name: Generate Prisma client
        run: cd backend && npx prisma generate
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder

      - run: cd backend && npm run lint

  # ─── Backend — Unit tests ──────────────────────────────────────────────────
  backend-tests:
    name: Backend — Unit tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: liberlo
          POSTGRES_PASSWORD: liberlo_dev
          POSTGRES_DB: liberlo_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - run: cd backend && npm ci

      - name: Generate Prisma client
        run: cd backend && npx prisma generate
        env:
          DATABASE_URL: postgresql://liberlo:liberlo_dev@localhost:5432/liberlo_test

      - name: Run migrations
        run: cd backend && npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://liberlo:liberlo_dev@localhost:5432/liberlo_test

      - name: Run unit tests
        run: cd backend && npm run test -- --passWithNoTests
        env:
          DATABASE_URL: postgresql://liberlo:liberlo_dev@localhost:5432/liberlo_test
          JWT_SECRET: ci_test_secret
          JWT_EXPIRES_IN: 8h
          OPENAI_API_KEY: sk-test-mock

  # ─── Frontend — Lint ──────────────────────────────────────────────────────
  frontend-lint:
    name: Frontend — Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: cd frontend && npm ci

      - run: cd frontend && npm run lint

  # ─── Frontend — Typecheck & Build ──────────────────────────────────────────
  frontend-build:
    name: Frontend — Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: cd frontend && npm ci

      - run: cd frontend && npm run build
        env:
          VITE_API_URL: http://localhost:3001
