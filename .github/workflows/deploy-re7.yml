name: Deploy — Re7 (staging)

on:
  push:
    branches: [re7]
  workflow_dispatch:

jobs:
  deploy-re7:
    name: Deploy to re7 environment
    runs-on: ubuntu-latest
    environment: re7

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        run: cd backend && npm ci

      - name: Generate Prisma client
        run: cd backend && npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://placeholder:placeholder@localhost:5432/placeholder' }}

      - name: Run database migrations
        if: ${{ secrets.DATABASE_URL != '' }}
        run: cd backend && npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Build backend
        run: cd backend && npm run build

      - name: Build frontend
        run: cd frontend && npm ci && npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'http://localhost:3001' }}

      # TODO: Configurer les étapes de déploiement re7 selon l'infrastructure choisie
      # Exemples : SSH + rsync, Railway, Render, Fly.io, docker build+push
      - name: Deploy (à configurer)
        run: echo "Étapes de déploiement re7 à configurer selon l'infrastructure"
